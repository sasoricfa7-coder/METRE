name: Transcrire le cours

on:
  push:
    paths:
      - "scans/**"
  schedule:
    - cron: "0 9 * * *"   # chaque jour à 9h UTC, après la réinitialisation des quotas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transcription
  cancel-in-progress: false

jobs:
  transcrire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours la dernière version, avec les pages déjà traitées

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lire les pages avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python traiter.py

      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultats/ rapport.json
          if ! git diff --cached --quiet; then
            git commit -m "Transcription automatique des pages"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
